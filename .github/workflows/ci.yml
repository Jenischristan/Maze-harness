name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage
        if: matrix.node == 20
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: CLI smoke test
        run: |
          node dist/cli.js --help
          # `report` on a missing runs dir must succeed with an empty list, not
          # fail; assert that instead of swallowing the exit code.
          node dist/cli.js report --json --runs-dir /tmp/empty-runs | grep -qx '\[\]'

      - name: CLI end-to-end
        if: matrix.node == 20
        run: pnpm test:cli

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runtime dependencies are the blocking gate: a vulnerable package that
      # ships with `bin` matters. Dev-only findings are reported but do not
      # fail the build, so a test-runner advisory cannot block every PR.
      - name: audit runtime dependencies (blocking)
        run: pnpm audit --prod --audit-level high
      - name: audit dev dependencies (report only)
        run: pnpm audit --audit-level high || true
